<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hingram</title>
    <!-- Tích hợp Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* CSS Tối giản, tông xám nhạt */
        :root {
            --bg-color: #f7f7f7;
            --container-bg: #ffffff;
            --text-main: #111111;
            --text-muted: #666666;
            --border-color: #e0e0e0;
            --btn-bg: #333333;
            --btn-text: #ffffff;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0; padding: 0; display: flex; justify-content: center;
        }
        .screen { display: none; width: 100%; max-width: 600px; min-height: 100vh; background: var(--container-bg); border-left: 1px solid var(--border-color); border-right: 1px solid var(--border-color); }
        .active { display: block; }
        
        /* Form Đăng nhập/Đăng ký */
        .auth-container { padding: 40px 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; }
        .auth-container h1 { margin-bottom: 30px; font-weight: 500; letter-spacing: 2px; }
        input { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid var(--border-color); border-radius: 6px; background: var(--bg-color); outline: none; }
        button { width: 100%; padding: 12px; background: var(--btn-bg); color: var(--btn-text); border: none; border-radius: 6px; cursor: pointer; font-weight: 500; margin-bottom: 15px; }
        .toggle-link { color: var(--text-muted); cursor: pointer; font-size: 14px; text-decoration: underline; }

        /* Header & Trang chủ */
        .header { display: flex; align-items: center; justify-content: space-between; padding: 15px 20px; border-bottom: 1px solid var(--border-color); position: sticky; top: 0; background: var(--container-bg); }
        .avatar-btn { width: 40px; height: 40px; border-radius: 50%; background: #ccc; cursor: pointer; }
        .post-feed { padding: 20px; }
        
        /* Modal Toàn màn hình (Profile, Create Post) */
        .fullscreen-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--container-bg); display: none; z-index: 1000; overflow-y: auto; padding: 20px; box-sizing: border-box; }
        .modal-active { display: block; }
        .close-btn { position: absolute; top: 20px; right: 20px; background: none; border: none; color: var(--text-main); font-size: 24px; cursor: pointer; width: auto;}
    </style>
</head>
<body>

    <!-- Màn hình Xác thực -->
    <div id="auth-screen" class="screen active">
        <div class="auth-container">
            <h1 id="auth-title">HINGRAM</h1>
            <input type="text" id="display-name" placeholder="Tên hiển thị" style="display:none;">
            <input type="email" id="email" placeholder="Email">
            <input type="password" id="password" placeholder="Mật khẩu">
            <!-- Supabase hỗ trợ gửi OTP 6 số qua email. Form xác nhận OTP sẽ được JS gọi ra sau -->
            <button id="auth-btn">Đăng nhập</button>
            <span class="toggle-link" id="toggle-auth">Bạn chưa có tài khoản? Đăng ký</span>
        </div>
    </div>

    <!-- Màn hình Trang chủ -->
    <div id="home-screen" class="screen">
        <div class="header">
            <div class="avatar-btn" onclick="openProfile()"></div>
            <button style="width: auto; padding: 8px 15px; margin: 0;" onclick="openCreatePost()">Tạo bài viết</button>
        </div>
        <div class="post-feed" id="feed">
            <!-- Bài viết render ở đây -->
        </div>
    </div>

    <!-- Modal Trang cá nhân -->
    <div id="profile-modal" class="fullscreen-modal">
        <button class="close-btn" onclick="closeModals()">✕</button>
        <div style="text-align: center; margin-top: 50px;">
            <div style="width: 100px; height: 100px; border-radius: 50%; background: #ccc; margin: 0 auto 20px;"></div>
            <button style="width: auto; padding: 5px 10px; font-size: 12px;">Đổi ảnh</button>
            <h2>Tên người dùng</h2>
            <p class="text-muted">@id_nguoidung</p>
            <p>Bio của người dùng ở đây...</p>
            <div style="margin: 30px 0;">
                <button style="background: var(--bg-color); color: var(--text-main); border: 1px solid var(--border-color);">Tùy chỉnh Giao diện</button>
                <button onclick="logout()" style="background: #ff4d4f; color: white;">Đăng xuất</button>
            </div>
        </div>
    </div>

    <!-- Modal Tạo bài viết -->
    <div id="create-post-modal" class="fullscreen-modal">
        <button class="close-btn" onclick="closeModals()">✕</button>
        <div style="margin-top: 50px;">
            <h3>Tạo bài viết mới</h3>
            <!-- Rich text editor đơn giản bằng contenteditable -->
            <div style="margin-bottom: 10px;">
                <button style="width: auto; display: inline; padding: 5px;" onclick="document.execCommand('bold')"><b>B</b></button>
                <button style="width: auto; display: inline; padding: 5px;" onclick="document.execCommand('italic')"><i>I</i></button>
            </div>
            <div contenteditable="true" id="post-content" style="min-height: 150px; border: 1px solid var(--border-color); padding: 10px; border-radius: 6px; outline: none; margin-bottom: 15px;"></div>
            <input type="file" id="post-image" accept="image/*" style="border:none; padding:0;">
            <button onclick="submitPost()">Đăng bài</button>
        </div>
    </div>

    <script>
        // Chuyển đổi Đăng nhập / Đăng ký UI
        let isLogin = true;
        document.getElementById('toggle-auth').addEventListener('click', () => {
            isLogin = !isLogin;
            document.getElementById('display-name').style.display = isLogin ? 'none' : 'block';
            document.getElementById('auth-btn').innerText = isLogin ? 'Đăng nhập' : 'Đăng ký';
            document.getElementById('toggle-auth').innerText = isLogin ? 'Bạn chưa có tài khoản? Đăng ký' : 'Bạn đã có tài khoản? Đăng nhập';
        });

        // Điều hướng Modal
        function openProfile() { document.getElementById('profile-modal').classList.add('modal-active'); }
        function openCreatePost() { document.getElementById('create-post-modal').classList.add('modal-active'); }
        function closeModals() {
            document.getElementById('profile-modal').classList.remove('modal-active');
            document.getElementById('create-post-modal').classList.remove('modal-active');
        }

        // Logic Supabase sẽ viết ở đây
        // const supabaseUrl = 'YOUR_SUPABASE_URL';
        // const supabaseKey = 'YOUR_SUPABASE_ANON_KEY';
        // const supabase = supabase.createClient(supabaseUrl, supabaseKey);
    </script>
</body>
</html>
